services:
  - type: web
    name: python-portfolio-abhinav
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_KEY
        sync: false
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
